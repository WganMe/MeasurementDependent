# Funding options for this repository.
#
# WHAT THIS DOES
#   GitHub reads this file and renders a "Sponsor" button on the repository
#   page. Per the GitHub docs, the file must live at .github/FUNDING.yml on the
#   DEFAULT BRANCH -- on any other branch it is ignored and no button appears.
#
# ONLY LIST WHAT EXISTS
#   Each key here must point at a real, registered account. A listing for a
#   profile that does not exist renders a button that leads to a dead end, which
#   is worse than no button. So this file currently names GitHub Sponsors only,
#   because that is the one funding method actually verified as registered.
#
#   The full set of supported keys, for reference, if one is ever added:
#     github: USERNAME            (or a list of up to 4)
#     patreon: USERNAME
#     open_collective: USERNAME
#     ko_fi: USERNAME
#     tidelift: PLATFORM-NAME/PACKAGE-NAME
#     community_bridge: PROJECT-NAME
#     liberapay: USERNAME
#     issuehunt: USERNAME
#     lfx_mentorship: PROJECT-NAME
#     polar: USERNAME
#     buy_me_a_coffee: USERNAME
#     thanks_dev: u/gh/USERNAME
#     custom: URL                 (or a list of up to 4)
#
# SCOPE NOTE
#   This funds the author's open-source work generally. It has no bearing on
#   the manuscript, its review, or the submission, and nothing in the paper
#   depends on it.

github: WganMe
